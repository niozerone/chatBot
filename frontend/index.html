<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VALORANT // RADIANT_AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        :root {
            --val-dark: #0F1923;
            --val-darker: #0b1219;
            --val-gray: #1F2326;
            --val-red: #FF4655;
            --val-white: #ECE8E1;
            --val-cyan: #00FFDF;
        }

        /* Buat background asli transparan */
        html { background-color: transparent; }

        body {
            /* Warna dan Gimmick Bentuk (Sudut terpotong miring) */
            background-color: var(--val-dark);
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
            border: 1px solid #333;
            color: var(--val-white);
            font-family: 'Roboto', sans-serif;
            margin: 10px; /* Jarak untuk bayangan transparan */
            height: calc(100vh - 20px);
            display: flex;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .sidebar { width: 260px; background-color: var(--val-darker); border-right: 1px solid #333; display: flex; flex-direction: column; }
        
        /* Area Header yang bisa didrag menggunakan mouse */
        .sidebar-header {
            padding: 20px; font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; color: var(--val-red); border-bottom: 1px solid #333; letter-spacing: 1px;
            --wails-draggable: drag; /* INI KUNCINYA AGAR BISA DIGESER */
            user-select: none;
        }

        .new-chat-btn { background-color: transparent; color: var(--val-white); border: 1px solid var(--val-red); margin: 15px; padding: 12px; font-family: 'Oswald', sans-serif; font-size: 16px; cursor: pointer; transition: all 0.2s; border-radius: 4px; }
        .new-chat-btn:hover { background-color: var(--val-red); }
        .chat-list { flex: 1; overflow-y: auto; padding: 0 15px; }
        .chat-list::-webkit-scrollbar { width: 5px; } .chat-list::-webkit-scrollbar-thumb { background: #333; }

        .chat-item-wrapper { display: flex; align-items: center; margin-bottom: 8px; background-color: var(--val-gray); border-radius: 4px; border-left: 3px solid transparent; transition: all 0.2s; }
        .chat-item-wrapper:hover { background-color: #2a2e32; }
        .chat-item-wrapper.active { border-left-color: var(--val-red); background-color: rgba(255, 70, 85, 0.1); }
        .chat-item { flex: 1; padding: 12px 15px; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item-wrapper.active .chat-item { font-weight: bold; }
        .delete-btn { background: transparent; border: none; color: #777; padding: 10px 15px; cursor: pointer; font-size: 18px; font-weight: bold; transition: color 0.2s; height: 100%; }
        .delete-btn:hover { color: var(--val-red); text-shadow: 0 0 8px var(--val-red); }

        .main-content { flex: 1; display: flex; flex-direction: column; }
        
        .header {
            padding: 15px 30px; background-color: var(--val-dark); border-bottom: 1px solid #333; font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 2px;
            display: flex; justify-content: space-between; align-items: center;
            --wails-draggable: drag; /* HEADER INI JUGA BISA DIGESER */
            user-select: none;
        }
        .header span { color: var(--val-red); margin-right: 10px; }
        
        /* Tombol Exit / Close buatan kita */
        .close-app-btn {
            --wails-draggable: no-drag; /* Agar tombol bisa diklik */
            background: transparent; border: 1px solid var(--val-red); color: var(--val-red); font-size: 16px; width: 35px; height: 35px; cursor: pointer; transition: 0.2s; font-family: 'Oswald', sans-serif;
        }
        .close-app-btn:hover { background: var(--val-red); color: #fff; }

        .chat-container { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        .chat-container::-webkit-scrollbar { width: 8px; } .chat-container::-webkit-scrollbar-track { background: var(--val-dark); } .chat-container::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; } .chat-container::-webkit-scrollbar-thumb:hover { background: var(--val-red); }
        .bubble { max-width: 85%; padding: 15px 20px; border-radius: 8px; line-height: 1.6; word-wrap: break-word; position: relative; animation: slideUp 0.3s ease-out; font-size: 15px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .user-bubble { align-self: flex-end; background-color: var(--val-red); color: #fff; border-bottom-right-radius: 0; box-shadow: 0 4px 15px rgba(255, 70, 85, 0.2); }
        .ai-bubble { align-self: flex-start; background-color: var(--val-gray); border-left: 4px solid var(--val-red); border-top-left-radius: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .ai-bubble p { margin-top: 0; margin-bottom: 10px; } .ai-bubble pre { background: #111; padding: 15px; border-radius: 6px; overflow-x: auto; border: 1px solid #333; } .ai-bubble code { font-family: 'Courier New', Courier, monospace; color: var(--val-cyan); background: #111; padding: 2px 5px; border-radius: 3px;} .ai-bubble strong { color: #fff; }
        .typing-indicator { color: var(--val-white); font-style: italic; font-size: 0.9em; align-self: flex-start; margin-left: 20px; display: none; opacity: 0.7; }
        .input-area { display: flex; padding: 20px 30px; background-color: var(--val-darker); border-top: 1px solid #333; align-items: center; }
        #fileBadge { display: none; align-items: center; padding: 0 15px; color: var(--val-cyan); font-weight: bold; border-right: 1px solid #333; margin-right: 15px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
        input[type="text"] { flex: 1; background: var(--val-dark); color: var(--val-white); border: 1px solid #333; padding: 15px 20px; border-radius: 4px; font-family: inherit; font-size: 16px; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: var(--val-red); }
        button { background-color: var(--val-red); color: #fff; border: none; padding: 0 25px; margin-left: 15px; border-radius: 4px; font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 18px; cursor: pointer; height: 50px; transition: all 0.2s; }
        button:hover { background-color: #ff5c6a; } button:disabled { background-color: #555; cursor: not-allowed; }
        .btn-attach { background-color: var(--val-gray); border: 1px solid #333; color: var(--val-white); } .btn-attach:hover { background-color: #333; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">SYS // NETWORK</div>
        <button class="new-chat-btn" onclick="startNewChat()">+ NEW MISSION</button>
        <div class="chat-list" id="chatList"></div>
    </div>

    <div class="main-content">
        <div class="header">
            <div><span>V</span> RADIANT // PROTOCOL</div>
            <button class="close-app-btn" onclick="closeApplication()">X</button>
        </div>

        <div class="chat-container" id="chatContainer"></div>
        <div class="typing-indicator" id="typingIndicator">Processing request...</div>

        <div class="input-area">
            <input type="file" id="fileUpload" style="display: none;" accept="image/*,audio/*,.pdf,.txt">
            <button onclick="document.getElementById('fileUpload').click()" id="attachBtn" class="btn-attach" title="Attach File">📎</button>
            <div id="fileBadge"></div>
            
            <input type="text" id="promptInput" placeholder="Send a message to Radiant..." autocomplete="off">
            <button onclick="executeGemini()" id="sendBtn">SEND</button>
        </div>
    </div>

    <script src="./src/main.js"></script> 
</body>
</html>
